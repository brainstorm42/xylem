fidelity:
  divergences: >-
    (1) p_c is defined as inf({p in [0,1] : theta_0(p) > 0} U {1}) rather than the textbook
    sup{p : theta(p) = 0}; the two agree because theta is non-decreasing (standard; the U {1} only
    fixes the degenerate case theta == 0, where it gives p_c = 1 instead of the real-number junk value
    inf(empty) = 0). (2) "Percolation" is the event that the open cluster of the origin is an infinite
    set of vertices (Grimmett's {|C| = infinity}); theta is its probability as a real number
    (Measure.real). (3) The nearest-neighbour graph on Z^d is encoded as Mathlib's Hasse diagram of the
    coordinatewise order on Fin d -> Z, which is exactly the graph with edges x ~ x +/- e_i. (4) Bond
    configurations are arbitrary subsets of Sym2(Z^d); under the measure, pairs that are not lattice
    edges are almost surely closed. (5) Only d >= 2 is claimed (for d = 1 the statement is false:
    p_c = 1 and theta(1) = 1). (6) Kozma-Nitzan is an arXiv preprint (v1); its Theorem 6 is re-proved
    in Lean here, so the result does not depend on the preprint's correctness. No other divergences known.

