status:
  scope: >-
    Formalized and compared: theta(p_c) = 0 for nearest-neighbour Bernoulli BOND percolation on Z^d,
    for every d >= 2 (BondPercolation.percolation_continuity) and for d = 3
    (BondPercolation.percolation_continuity_Z3), with p_c defined as an infimum (see fidelity).
    Also proved in the library but NOT among the compared declarations: Kozma-Nitzan's Conjecture 3
    and the additive gluing inequality on finite weighted graphs, the conditioned slack hierarchy,
    Kozma-Nitzan's Theorem 6, the Barsky-Grimmett-Newman half-space theorem, Kesten's p_c(Z^2) = 1/2.
    Nothing new is claimed about site percolation, other lattices or slabs (the Duminil-Copin-
    Sidoravicius-Tassion slab theorem is formalized, as a literature input), continuity of theta as a
    function on [0,1] (equivalent by standard facts that are not part of the compared statement), or
    quantitative bounds on theta near p_c. Kozma-Nitzan's Conjecture 3 is obtained through the
    stronger ADDITIVE gluing inequality; their Conjectures 1 (multiplicative form), 2 and 4 are not
    addressed. Nothing is conditional: no extra hypotheses, no axioms beyond the three standard ones.
  sorry_count: 0   # the library, Solution.lean; Challenge.lean carries the 2 placeholder proofs of the trusted statement file by design
