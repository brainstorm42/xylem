# formalization.yaml v0.4 -- Palomar registry metadata for this repository.
version: "v0.4"

project:
  name: "Percolation — θ(p_c) = 0 for Bernoulli bond percolation on ℤ^d in all dimensions d ≥ 2"   # project folder `percolation/`; directory `percolation/` of anthropics/formal-math; Lake package PercolationContinuity, library Percolation
  # The concise public registry abstract (Palomar shows exactly this text).
  description: >-
    We prove θ(p_c) = 0 for nearest-neighbour Bernoulli bond percolation on ℤ^d for every dimension d ≥
    2: at the critical parameter the open cluster of the origin is almost surely finite
    (`Percolation.Continuity.CSH.percolationContinuity_allDimensions : ∀ d, 2 ≤ d →
    PercolationContinuity d`, in Lean 4 / Mathlib; comparator-checked over Mathlib-only definitions as
    `BondPercolation.percolation_continuity` and, for d = 3,
    `BondPercolation.percolation_continuity_Z3`). In particular this covers ℤ³, where it yields the
    classical corollary that p ↦ θ(p) is continuous on [0,1]; the formal statement is the vanishing of θ
    at p_c, and the classical equivalence with continuity on [0,1] is not itself part of the formal
    statement. The result was previously known for d = 2 (Harris, Kesten) and for d ≥ 11 (lace
    expansion); the cases 3 ≤ d ≤ 10 were open.

    The route is Kozma–Nitzan's reduction (arXiv:2401.12397): they conjectured gluing inequalities for
    percolation on arbitrary finite weighted graphs and proved (their Theorem 6) that the weakest of
    them, Conjecture 3, implies θ(p_c) = 0 on ℤ^d for all d ≥ 2. This development proves Conjecture 3
    (`Percolation.Continuity.CSH.kozmaNitzan_conjecture3_holds`) through a stronger additive gluing
    inequality (`Percolation.Continuity.CSH.additiveGluing_holds`): if P(a ↔ b) ≥ 1 − t for every a ∈ A,
    then P(o ↔ b) ≥ P(o ↔ A) − t. Additive gluing is derived from a new conditioned slack hierarchy
    (`Percolation.Continuity.CSH.cshHolds`): conditioned covariance inequalities for increasing
    functions of a single open cluster, indexed by finite lists of auxiliary vertices and proved by
    induction on the list, whose level-zero unconditioned case is the Harris inequality. Kozma–Nitzan's
    Theorem 6 and every classical input (Harris, van den Berg–Häggström–Kahn, the four functions
    theorem, Gladkov's decision-tree Harris–Kleitman inequality, the Barsky–Grimmett–Newman half-space
    theorem, Kesten's p_c(ℤ²) = 1/2) are re-proved in the library from Mathlib, so the statement has no
    hypothesis other than 2 ≤ d. Kozma–Nitzan's Conjectures 1, 2 and 4 are neither proved nor stated;
    nothing new is claimed about slabs, site percolation or other lattices. All main theorems depend
    only on propext, Classical.choice and Quot.sound; there is no sorry outside the two deliberate
    placeholders of the statement file Challenge.lean and no added axiom. The work has not yet been
    refereed by anyone independent of the author; correctness rests on the mechanical checks recorded in
    AUDIT.md, and readers should check that Challenge.lean states the intended theorem.
  # Required nonempty list of name strings (human authors).
  authors:
    - "Justin Leder"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Justin Leder"   # GitHub: jleder3

