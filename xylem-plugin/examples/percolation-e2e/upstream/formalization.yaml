      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "comparator.json"
    - declaration: "BondPercolation.percolation_continuity_Z3"
      file: "Solution.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: "comparator.json"
    - declaration: "Percolation.Continuity.CSH.percolationContinuity_allDimensions"
      file: "Percolation/Continuity/MainTheorem.lean"
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: "Percolation.Continuity.CSH.kozmaNitzan_conjecture3_holds"
